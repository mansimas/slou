<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Leather texture">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#b98f5c"/>
      <stop offset="0.5" stop-color="#9c7043"/>
      <stop offset="1" stop-color="#6f4c2b"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#e9cfa4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9cfa4" stop-opacity="0"/>
    </radialGradient>
    <filter id="leathertex">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26"/>
    </filter>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch" result="g"/>
      <feColorMatrix in="g" type="matrix"
        values="0 0 0 0 0.20  0 0 0 0 0.13  0 0 0 0 0.06  0 0 0 0.6 0"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#lg)"/>
  <rect width="800" height="1000" fill="url(#lg)" filter="url(#leathertex)" opacity="0.9"/>
  <ellipse cx="280" cy="240" rx="520" ry="420" fill="url(#sheen)"/>
  <!-- stitched seam -->
  <line x1="120" y1="60" x2="120" y2="940" stroke="#3d2817" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="120" y1="60" x2="120" y2="940" stroke="#f0d9b3" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <rect width="800" height="1000" filter="url(#grain2)" opacity="0.55"/>
</svg>
